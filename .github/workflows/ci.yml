name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Check ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-2022 }
          - { name: macOS ARM64, os: macos-15 }
          - { name: macOS Intel, os: macos-15-intel }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:git
      - run: npm run check
      - run: npm test
      - name: Check mouse and immediate touch dragging
        if: runner.os == 'Windows'
        run: npm run test:drag
      - name: Check continuous current flow animations
        if: runner.os == 'Windows'
        run: npm run test:flow
      - name: Check UI scaling and tiny readings
        if: runner.os == 'Windows'
        run: npm run test:preferences
      - name: Install Electron test runtime
        run: node node_modules/electron/install.js
      - name: Prepare Linux display and sandbox
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openbox dbus-x11 libgtk-3-0t64 libnss3 libgbm1 libasound2t64
          sandbox="$(node -p "require('node:path').join(require('node:path').dirname(require('electron')), 'chrome-sandbox')")"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
      - name: Electron check
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Electron check with virtual display
        if: runner.os == 'Linux'
        shell: bash
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1920x1080x24" sh -c 'openbox >/tmp/circuit-lab-openbox.log 2>&1 & exec npm run test:desktop'
      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-diagnostics-${{ matrix.os }}
          path: artifacts/desktop/
          if-no-files-found: ignore
          retention-days: 7

