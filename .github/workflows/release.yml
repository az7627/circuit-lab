name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:git
      - run: npm run check
      - run: npm test
      - id: version
        run: npm run release:check

  android:
    name: Package Android
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: npm ci
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Install required Android SDK
        shell: bash
        run: sdkmanager 'platforms;android-36' 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Restore fixed signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo 'ANDROID_KEYSTORE_BASE64 is required; unsigned/debug fallback is disabled.' >&2
            exit 1
          fi
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/circuit-lab-release.jks"
          printf 'ANDROID_KEYSTORE_FILE=%s/circuit-lab-release.jks\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Build, lint and verify signed APK/AAB
        run: npm run android:ci
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_RELEASE_PUBLIC_KEY: ${{ secrets.ANDROID_RELEASE_PUBLIC_KEY }}
          ANDROID_RELEASE_CERT_SHA256: ${{ secrets.ANDROID_RELEASE_CERT_SHA256 }}
      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-android
          path: |
            release/android/*.apk
            release/android/*.aab
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
      - name: Upload Android diagnostics and incomplete output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: diagnostics-android
          path: |
            android/app/build/reports/
            android/build/reports/
            release/android/
          if-no-files-found: ignore
          retention-days: 7
      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/circuit-lab-release.jks"

  system-webview:
    name: Package system WebView ${{ matrix.name }}
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-2022 }
          - { name: macOS ARM64, os: macos-15 }
          - { name: macOS Intel, os: macos-15-intel }
          - { name: Linux x64, os: ubuntu-24.04 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup override set 1.97.1
      - name: Linux system WebView and bundle dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf xvfb openbox dbus-x11 libfuse2t64
      - run: npm ci
      - name: Check mouse and immediate touch dragging
        if: runner.os == 'Windows'
        run: npm run test:drag
      - run: npm run system:build
      - name: Check system WebView application
        if: runner.os != 'Linux'
        run: npm run test:system
      - name: Check system WebView application with virtual display
        if: runner.os == 'Linux'
        run: dbus-run-session -- xvfb-run -a --server-args="-screen 0 1920x1080x24" sh -c 'openbox >/tmp/circuit-lab-system-openbox.log 2>&1 & exec npm run test:system'
      - name: Upload system WebView packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: packages-system-${{ matrix.os }}
          path: release/system-webview/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload system WebView diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: diagnostics-system-${{ matrix.os }}
          path: artifacts/system-webview/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    name: Verify complete release asset inventory
    needs: [prepare, android, system-webview]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: release/collected
      - run: npm run release:verify

  publish:
    name: Publish GitHub Release
    needs: [prepare, verify]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          merge-multiple: true
          path: release/collected
      - name: Validate all assets, create checksums and publish
        run: npm run release:publish
        env:
          GH_TOKEN: ${{ github.token }}
